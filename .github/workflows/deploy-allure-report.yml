name: Deploy Allure Report (Nightly)

on:
  workflow_run:
    workflows: ["Nightly Regression Tests"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre unzip
          curl -o allure.zip -L https://github.com/allure-framework/allure2/releases/download/2.20.1/allure-2.20.1.zip
          unzip allure.zip -d /opt/allure
          sudo ln -s /opt/allure/allure-2.20.1/bin/allure /usr/bin/allure

      - name: Generate Allure Report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-allure-report
          path: allure-report

